services:
  backend:
    build: ./backend
    container_name: network-map-backend
    network_mode: host
    privileged: true
    environment:
      - SCAN_SUBNET=${SCAN_SUBNET:-192.168.1.0/24}
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-15}
      - OFFLINE_TIMEOUT_MINUTES=${OFFLINE_TIMEOUT_MINUTES:-30}
      - SCAN_EXCLUDE_SUBNETS=${SCAN_EXCLUDE_SUBNETS:-}
    volumes:
      - ./datas:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: network-map-frontend
    network_mode: host
    restart: unless-stopped
